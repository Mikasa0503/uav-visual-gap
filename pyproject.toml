[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-visual-gap"
version = "0.1.0"
description = "Privileged teacher and visual student learning for agile quadrotor gap traversal"
requires-python = ">=3.8,<3.9"
dependencies = ["numpy>=1.23,<1.24", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
